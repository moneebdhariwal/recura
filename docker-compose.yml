version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php-fpm
    container_name: recura-app
    restart: unless-stopped
    working_dir: /var/www/src
    volumes:
      - ./src/.env:/var/www/src/.env
      - storage_data:/var/www/src/storage/app/public
    env_file:
      - src/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: recura-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - storage_data:/var/www/src/storage/app/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

  db:
    image: mysql:8.0
    container_name: recura-db
    restart: unless-stopped
    env_file:
      - src/.env
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  dbdata:
  storage_data:
